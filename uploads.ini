; Raises PHP's hard upload ceiling above WordPress's own 8MB image check
; (see web/app/themes/marnie-therapy/inc/image-optimization.php), so
; oversized image uploads fail with a clear WP-side message instead of a
; generic PHP error, while still allowing larger non-image files (PDFs etc.)
; up to post_max_size.
upload_max_filesize = 16M
post_max_size = 20M
